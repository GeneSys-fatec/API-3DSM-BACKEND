server.port=8000

spring.cloud.gateway.routes[0].id=auth_service_route
spring.cloud.gateway.routes[0].uri=http://localhost:8081/
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/login, /auth/logout

spring.cloud.gateway.routes[1].id=monolito_service_route
spring.cloud.gateway.routes[1].uri=http://localhost:8080/
spring.cloud.gateway.routes[1].predicates[0]=Path=/google/**, /anexo/**

spring.cloud.gateway.routes[2].id=usuario_equipe_service_route
spring.cloud.gateway.routes[2].uri=http://localhost:8083/
spring.cloud.gateway.routes[2].predicates[0]=Path=/auth/cadastrar, /auth/session, /equipe/**, /usuario/**

spring.cloud.gateway.routes[3].id=projeto_coluna_tarefa_service_route
spring.cloud.gateway.routes[3].uri=http://localhost:8087/
spring.cloud.gateway.routes[3].predicates[0]=Path=/colunas/**, /tarefa/**, /projeto/**, /api/tasks-data/**

spring.cloud.gateway.routes[4].id=comentario_service_route
spring.cloud.gateway.routes[4].uri=http://localhost:8082/
spring.cloud.gateway.routes[4].predicates[0]=Path=/comentario/**

spring.cloud.gateway.routes[5].id=notificacao_service_route
spring.cloud.gateway.routes[5].uri=http://localhost:8086/
spring.cloud.gateway.routes[5].predicates[0]=Path=/notificacao/**

spring.cloud.gateway.routes[6].id=metricas_service_route
spring.cloud.gateway.routes[6].uri=http://localhost:8085/
spring.cloud.gateway.routes[6].predicates[0]=Path=/dashboard/**

# Anexo service (upload/list/download)
spring.cloud.gateway.routes[7].id=anexo_service_route
spring.cloud.gateway.routes[7].uri=http://localhost:8085/
spring.cloud.gateway.routes[7].predicates[0]=Path=/anexos/**

# Compatibility: legacy frontend calls
spring.cloud.gateway.routes[8].id=anexo_upload_compat
spring.cloud.gateway.routes[8].uri=http://localhost:8085/
spring.cloud.gateway.routes[8].predicates[0]=Path=/tarefa/*/upload
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/tarefa/(?<id>.*)/upload,/anexos/tarefa/${id}/upload
spring.cloud.gateway.routes[8].order=-2

spring.cloud.gateway.routes[9].id=anexo_list_compat
spring.cloud.gateway.routes[9].uri=http://localhost:8085/
spring.cloud.gateway.routes[9].predicates[0]=Path=/tarefa/*/anexos
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/tarefa/(?<id>.*)/anexos,/anexos/tarefa/${id}
spring.cloud.gateway.routes[9].order=-2

spring.cloud.gateway.default-filters[0]=RemoveResponseHeader=WWW-Authenticate

logging.level.org.springframework.cloud.gateway=DEBUG